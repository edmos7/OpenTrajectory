[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lerobot_policy_open_trajectory"
version = "0.2.0"
description = "Trajectory-conditioned diffusion policies and LeRobot dataset tooling"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Open Trajectory contributors" }]
dependencies = [
  "av>=14",
  "diffusers>=0.35",
  "lerobot[dataset]>=0.6.1,<0.7",
  "numpy>=1.26",
  "opencv-python>=4.10",
  "pillow>=10",
  "torch>=2.7",
  "torchvision>=0.22",
]

[project.optional-dependencies]
training = ["lerobot[training]>=0.6.1,<0.7"]
data = [
  "scipy>=1.14",
  "ultralytics>=8.3",
]
depth = ["huggingface-hub>=0.34"]
predictors = ["timm>=1.0", "safetensors>=0.4"]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6",
  "ruff>=0.12",
]

[project.scripts]
open-trajectory = "lerobot_policy_open_trajectory.cli:main"

[project.urls]
Repository = "https://github.com/edmos7/OpenTrajectory"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/configs",
  "/docs",
  "/data_generation",
  "/training",
  "/utils",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lerobot_policy_open_trajectory"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
